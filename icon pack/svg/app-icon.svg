      <stop offset="0" stop-color="#0A0C10"/>
      <stop offset="0.55" stop-color="#11151D"/>
      <stop offset="1" stop-color="#161C2B"/>
    </linearGradient>
    <radialGradient id="nebInd" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C5CE0" stop-opacity="0.10"/>
      <stop offset="0.7" stop-color="#4C5CE0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#4C5CE0" stop-opacity="0"/>
